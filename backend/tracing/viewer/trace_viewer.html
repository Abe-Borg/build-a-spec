<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build-a-Spec — Trace Viewer</title>
<!--
  Self-contained viewer for Build-a-Spec trace runs. Zero network: all
  styles are inline and all parsing happens locally in the browser (the
  previous Spec Critic viewer needed a CDN stylesheet, which contradicted
  the app's loads-nothing-from-the-internet posture). Reads the four run
  files (run.json, spans.jsonl, events.jsonl, prompts.jsonl) from a folder
  the user picks; event-type filters are built from the types actually
  present, so new capture vocabulary needs no viewer edit.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
    color: #1f2430; background: #f4f5f7;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  header {
    background: #232839; color: #fff; padding: 8px 14px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .openbtn {
    background: #3b82f6; color: #fff; border-radius: 6px;
    padding: 4px 12px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .openbtn:hover { background: #2f6fe0; }
  .openbtn input { display: none; }
  #runSummary { font-size: 12px; color: #c3c9dc; }
  #loadError { font-size: 12px; color: #ff9d9d; }
  #runMeta {
    background: #fff; border-bottom: 1px solid #dde0e8; padding: 6px 14px;
    display: none; flex-wrap: wrap; gap: 4px 22px; font-size: 12px; color: #4a5065;
  }
  #runMeta b { color: #1f2430; font-weight: 600; }
  #empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; color: #8a90a3; padding: 0 30px;
  }
  #empty p + p { margin-top: 8px; font-size: 13px; }
  #empty .hint { font-size: 12px; color: #a7adc0; margin-top: 16px; }
  main { flex: 1; display: none; overflow: hidden; }
  .cols { display: grid; grid-template-columns: 34% 66%; height: 100%; }
  .pane { overflow-y: auto; background: #fff; }
  .pane + .pane { border-left: 1px solid #dde0e8; }
  .tree { padding: 8px 6px; }
  .node {
    display: flex; align-items: baseline; gap: 6px; padding: 3px 8px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .node:hover { background: #eef1f6; }
  .node.sel { background: #dbe7ff; }
  .node .kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    background: #e4e7ef; color: #4a5065; border-radius: 4px; padding: 0 5px;
  }
  .node .dot { width: 8px; height: 8px; border-radius: 99px; flex: none; align-self: center; }
  .dot.ok { background: #16a34a; }
  .dot.error { background: #dc2626; }
  .dot.open { background: #d97706; }
  .node .dur { margin-left: auto; font-size: 11px; color: #8a90a3; }
  .detail { padding: 12px 16px; }
  .detail h2 { font-size: 15px; margin-bottom: 2px; }
  .detail .sub { font-size: 12px; color: #6b7185; margin-bottom: 10px; }
  .kv { margin: 8px 0; }
  .kv dt { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #8a90a3; margin-top: 8px; }
  .kv dd pre {
    background: #f4f5f7; border: 1px solid #e4e7ef; border-radius: 6px;
    padding: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  }
  .err { color: #b91c1c; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip {
    font-size: 11px; border: 1px solid #c9cede; border-radius: 99px;
    padding: 1px 9px; cursor: pointer; user-select: none; color: #4a5065; background: #fff;
  }
  .chip.on { background: #232839; border-color: #232839; color: #fff; }
  .evt { border-top: 1px solid #eef0f5; padding: 6px 2px; }
  .evt .head { display: flex; gap: 10px; align-items: baseline; font-size: 12px; }
  .evt .type { font-weight: 600; }
  .evt .when { color: #8a90a3; font-size: 11px; }
  .evt pre {
    background: #f8f9fb; border-radius: 5px; padding: 6px 8px; margin-top: 4px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  }
  details.prompt { margin-top: 4px; }
  details.prompt summary { cursor: pointer; font-size: 12px; color: #2f6fe0; }
  details.prompt pre { max-height: 320px; overflow: auto; }
  .count { color: #8a90a3; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Build-a-Spec — Trace Viewer</h1>
  <label class="openbtn">Open trace folder…
    <input id="dirInput" type="file" webkitdirectory directory multiple />
  </label>
  <span id="runSummary"></span>
  <span id="loadError"></span>
</header>

<div id="runMeta"></div>

<div id="empty">
  <div>
    <p style="font-size:19px">No trace loaded</p>
    <p>Click <b>Open trace folder…</b> and select one run directory
      (<span class="mono">session-…</span>) from the app's trace folder —
      the exact path is shown in <b>Settings → Developer tools</b>.</p>
    <p class="hint">All parsing happens locally in this page. Nothing is uploaded anywhere.</p>
  </div>
</div>

<main id="main"><div class="cols">
  <section class="pane"><div id="tree" class="tree"></div></section>
  <section class="pane"><div id="detail" class="detail"></div></section>
</div></main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
let RUN = null;        // run.json object
let SPANS = [];        // closed spans from spans.jsonl
let EVENTS = [];       // events from events.jsonl
let PROMPTS = {};      // hash -> {kind, text}
let SELECTED = null;   // selected node id ("run" or span_id)
let FILTERS = null;    // Set of enabled event types (null = all)

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function fmtTs(t) {
  if (typeof t !== "number") return "—";
  const d = new Date(t * 1000);
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
}
function fmtDate(t) {
  return typeof t === "number" ? new Date(t * 1000).toLocaleString() : "—";
}
function fmtDur(s) {
  if (typeof s !== "number" || !isFinite(s) || s < 0) return "";
  if (s < 1) return `${Math.round(s * 1000)}ms`;
  if (s < 90) return `${s.toFixed(1)}s`;
  return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
}

function parseJsonl(text) {
  const out = [];
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (!t) continue;
    try { out.push(JSON.parse(t)); } catch (e) { /* torn final line etc. */ }
  }
  return out;
}

$("dirInput").addEventListener("change", async (ev) => {
  const files = [...ev.target.files];
  $("loadError").textContent = "";
  const byName = (name) => files.filter((f) => f.name === name);
  if (byName("run.json").length > 1) {
    $("loadError").textContent =
      "That folder holds several runs — select ONE session-… directory, not the traces root.";
    return;
  }
  const readOne = async (name, fallback) => {
    const f = byName(name)[0];
    return f ? await f.text() : fallback;
  };
  try {
    const runText = await readOne("run.json", "{}");
    RUN = JSON.parse(runText || "{}");
  } catch (e) { RUN = {}; }
  SPANS = parseJsonl(await readOne("spans.jsonl", ""));
  EVENTS = parseJsonl(await readOne("events.jsonl", ""));
  PROMPTS = {};
  for (const p of parseJsonl(await readOne("prompts.jsonl", ""))) {
    if (p && p.hash) PROMPTS[p.hash] = p;
  }
  if (!SPANS.length && !EVENTS.length && !Object.keys(RUN).length) {
    $("loadError").textContent = "No trace files found in that folder.";
    return;
  }
  SELECTED = "run";
  FILTERS = null;
  render();
});

function runId() { return RUN.run_id || (SPANS[0] && SPANS[0].run_id) || "run"; }

function spanIndex() {
  const known = new Map(SPANS.map((s) => [s.span_id, s]));
  // Events pointing at a span never closed (a crash mid-span) still need a
  // node — synthesize an "unclosed" span for them.
  for (const e of EVENTS) {
    if (e.span_id && e.span_id !== runId() && !known.has(e.span_id)) {
      known.set(e.span_id, {
        span_id: e.span_id, kind: "?", name: `(unclosed span ${e.span_id})`,
        started_at: e.ts, ended_at: null, status: "open",
      });
    }
  }
  return known;
}

function render() {
  $("empty").style.display = "none";
  $("main").style.display = "block";
  const env = RUN.environment || {};
  const dur = (typeof RUN.started_at === "number" && typeof RUN.ended_at === "number")
    ? fmtDur(RUN.ended_at - RUN.started_at) : (RUN.ended_at == null ? "still open / not closed cleanly" : "");
  $("runSummary").textContent =
    `${runId()} • ${SPANS.length} spans • ${EVENTS.length} events`;
  const bits = [
    ["run", runId()],
    ["started", fmtDate(RUN.started_at)],
    ["ended", RUN.ended_at == null ? "— (no clean stop recorded)" : fmtDate(RUN.ended_at)],
    ["duration", dur],
    ["model", RUN.model],
    ["capture", RUN.capture_level],
    ["app", RUN.app_version],
    ["resumes", (RUN.resumed_at || []).length || ""],
    ["platform", env.platform],
    ["python", env.python],
    ["frozen", env.frozen === undefined ? "" : env.frozen],
    ["pid", env.pid],
  ].filter(([, v]) => v !== "" && v !== undefined && v !== null);
  $("runMeta").innerHTML = bits.map(([k, v]) => `<span>${esc(k)}: <b>${esc(v)}</b></span>`).join("");
  $("runMeta").style.display = "flex";
  renderTree();
  renderDetail();
}

function renderTree() {
  const idx = spanIndex();
  const children = new Map();
  for (const s of idx.values()) {
    const parent = s.parent_span_id && idx.has(s.parent_span_id) ? s.parent_span_id : "run";
    if (!children.has(parent)) children.set(parent, []);
    children.get(parent).push(s);
  }
  for (const list of children.values()) list.sort((a, b) => (a.started_at || 0) - (b.started_at || 0));
  const eventCounts = new Map();
  for (const e of EVENTS) {
    eventCounts.set(e.span_id, (eventCounts.get(e.span_id) || 0) + 1);
  }
  const rows = [];
  const runEvents = eventCounts.get(runId()) || 0;
  rows.push(nodeHtml("run", 0, {
    kind: "run", name: "application run", status: "ok",
    started_at: RUN.started_at, ended_at: RUN.ended_at,
  }, runEvents));
  const walk = (parentId, depth) => {
    for (const s of children.get(parentId) || []) {
      rows.push(nodeHtml(s.span_id, depth, s, eventCounts.get(s.span_id) || 0));
      walk(s.span_id, depth + 1);
    }
  };
  walk("run", 1);
  $("tree").innerHTML = rows.join("");
  for (const el of $("tree").querySelectorAll(".node")) {
    el.addEventListener("click", () => {
      SELECTED = el.dataset.id;
      FILTERS = null;
      renderTree();
      renderDetail();
    });
  }
}

function nodeHtml(id, depth, span, eventCount) {
  const dur = (typeof span.started_at === "number" && typeof span.ended_at === "number")
    ? fmtDur(span.ended_at - span.started_at) : "";
  const dot = span.status === "error" ? "error" : (span.ended_at == null && id !== "run") ? "open" : "ok";
  return `<div class="node${SELECTED === id ? " sel" : ""}" data-id="${esc(id)}"
    style="margin-left:${depth * 16}px">
    <span class="dot ${dot}"></span>
    <span class="kind">${esc(span.kind || "?")}</span>
    <span>${esc(span.name || id)}</span>
    ${eventCount ? `<span class="count">${eventCount}ev</span>` : ""}
    <span class="dur">${esc(dur)}</span>
  </div>`;
}

function promptHtml(value) {
  // {ref, kind} at the default capture level; {inline} in deep mode.
  if (value && typeof value === "object" && value.ref) {
    const p = PROMPTS[value.ref];
    const label = `${value.kind || (p && p.kind) || "prompt"} ${value.ref}`;
    if (p) {
      return `<details class="prompt"><summary>show ${esc(label)}</summary><pre>${esc(p.text)}</pre></details>`;
    }
    return `<span class="mono">${esc(label)} (not in prompts.jsonl)</span>`;
  }
  if (value && typeof value === "object" && typeof value.inline === "string") {
    return `<details class="prompt"><summary>show inline prompt</summary><pre>${esc(value.inline)}</pre></details>`;
  }
  return null;
}

function eventHtml(e) {
  const { ts, span_id, type, ...fields } = e;
  const prompts = [];
  const plain = {};
  for (const [k, v] of Object.entries(fields)) {
    const ph = promptHtml(v);
    if (ph) prompts.push(`<div><b>${esc(k)}</b>: ${ph}</div>`);
    else plain[k] = v;
  }
  const body = Object.keys(plain).length
    ? `<pre>${esc(JSON.stringify(plain, null, 1))}</pre>` : "";
  return `<div class="evt">
    <div class="head"><span class="type">${esc(type || "?")}</span>
      <span class="when">${esc(fmtTs(ts))}</span></div>
    ${body}${prompts.join("")}
  </div>`;
}

function renderDetail() {
  const idx = spanIndex();
  const isRun = SELECTED === "run" || !idx.has(SELECTED);
  const events = EVENTS.filter((e) =>
    isRun ? e.span_id === runId() : e.span_id === SELECTED
  );
  const types = [...new Set(events.map((e) => e.type || "?"))].sort();
  const active = FILTERS || new Set(types);
  const shown = events.filter((e) => active.has(e.type || "?"));

  let head;
  if (isRun) {
    head = `<h2>application run</h2>
      <div class="sub mono">${esc(runId())}</div>
      <div class="sub">Run-level events (REST activity, exports, stops, client errors…).
        Select a span on the left for turn / research / QC detail.</div>`;
  } else {
    const s = idx.get(SELECTED);
    const dur = (typeof s.started_at === "number" && typeof s.ended_at === "number")
      ? fmtDur(s.ended_at - s.started_at) : "(never closed — crash or still running)";
    head = `<h2>${esc(s.name || SELECTED)}</h2>
      <div class="sub"><span class="mono">${esc(s.span_id)}</span>
        • ${esc(s.kind || "?")} • ${esc(s.status || "open")} • ${esc(dur)}
        • started ${esc(fmtTs(s.started_at))}</div>
      ${s.error ? `<div class="err">error: ${esc(s.error)}</div>` : ""}
      <dl class="kv">
        ${objRow("inputs", s.inputs)}
        ${objRow("outputs", s.outputs)}
        ${objRow("metadata", s.metadata)}
      </dl>`;
  }

  const chips = types.map((t) =>
    `<span class="chip${active.has(t) ? " on" : ""}" data-type="${esc(t)}">${esc(t)}</span>`
  ).join("");

  $("detail").innerHTML = `${head}
    ${types.length ? `<div class="filters">${chips}</div>` : ""}
    <div class="count">${shown.length} of ${events.length} events</div>
    ${shown.map(eventHtml).join("") || '<div class="sub" style="margin-top:8px">No events on this span.</div>'}`;

  for (const chip of $("detail").querySelectorAll(".chip")) {
    chip.addEventListener("click", () => {
      const t = chip.dataset.type;
      const next = new Set(active);
      if (next.has(t)) next.delete(t); else next.add(t);
      FILTERS = next;
      renderDetail();
    });
  }
}

function objRow(label, obj) {
  if (!obj || (typeof obj === "object" && !Object.keys(obj).length)) return "";
  const prompts = [];
  const plain = {};
  for (const [k, v] of Object.entries(obj)) {
    const ph = promptHtml(v);
    if (ph) prompts.push(`<div><b>${esc(k)}</b>: ${ph}</div>`);
    else plain[k] = v;
  }
  const pre = Object.keys(plain).length
    ? `<pre>${esc(JSON.stringify(plain, null, 1))}</pre>` : "";
  return `<dt>${esc(label)}</dt><dd>${pre}${prompts.join("")}</dd>`;
}
</script>
</body>
</html>
